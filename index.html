<!doctype html>
<!--
  The page shell. The browser loads this file first.
  It loads the icon font, the web fonts, and the stylesheet. Then it starts the
  Rust client, which builds the whole game screen from JavaScript code in pkg/.
  The body starts empty. Leptos fills it in when the client starts.
-->
<html lang="en">
<head>
<!-- Character set and a viewport that scales to the device width. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost Harbor</title>
<!-- The browser tab icon. -->
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<!-- Tabler icon font. The client uses the classes such as ti ti-heart for icons. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<!-- Web fonts: Comfortaa for the brand, Rubik for text, and Roboto Mono for numbers. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Roboto+Mono:wght@400;500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<!-- The game's own styles. See style.css for the layout and the CSS variables. -->
<link rel="stylesheet" href="style.css">
<!--
  Starts the Rust client. `init` loads the compiled WebAssembly file from pkg/.
  If loading fails, the page shows a short message instead of a blank screen.
-->
<script type="module">
  import init from "./pkg/lh_client.js";
  init().catch((e) => {
    console.error(e);
    document.body.innerHTML = '<p style="padding:24px;font:14px system-ui;color:#E57373">Lost Harbor failed to load. Try reloading the page.</p>';
  });
</script>
</head>
<!-- data-mode is read by the stylesheet. "walking" is the normal view. The client
     changes it to "piloting" when you fly a ship, and the CSS adjusts the layout. -->
<body data-mode="walking"></body>
</html>
